name: 단지 메타 수집

# 일일 트래픽이 상세기능당 5,000건이라 전국 약 3만 단지를 하루에 못 받는다.
# 매일 예산만큼만 받아 이어붙이고, 다 채워지면 알아서 빈 실행이 된다.
on:
  schedule:
    - cron: '30 20 * * *'   # UTC 20:30 = KST 05:30 (실거래 갱신과 안 겹치게)
  # 깃허브 'Run workflow' 폼이 이 저장소에서 자꾸 렌더링에 실패한다.
  # 그럴 때 .github/run-now 를 아무렇게나 고쳐서 커밋하면 전체(목록·상세·좌표·학교)가 한 번 돈다.
  push:
    paths:
      - '.github/run-now'
  workflow_dispatch:
    inputs:
      stage:
        description: '실행 단계'
        type: choice
        default: 'daily'
        options:
          - daily     # 목록 보충 + 상세 수집 + 산출 (평소 이것)
          - probe     # 인증키·필드명 확인용. 원시 XML만 출력하고 끝
          - list      # 단지코드 목록만
          - emit      # 재수집 없이 JSON만 다시 생성
          - geocode   # 도로명주소 → 좌표 (KAKAO_REST_KEY). 초품아·직주근접·역세권이 여기서 열린다
          - schools   # 학교알리미 학교 목록·좌표 (SCHOOLINFO_KEY). 학교는 잘 안 바뀌어서 가끔만
          - crowd     # 학급당 학생수(과밀). OpenAPI apiType=09
          - progress  # 중학교 졸업생의 진로 현황(특목·자사 진학률). 공시가 연 1회라 11월 이후에만 바뀐다
      budget:
        description: '상세기능당 이번 실행 호출 수 (한도 5000)'
        default: '4800'
      sido:
        description: "stage=schools 일 때만. 비우면 전국 (예: 서울특별시 경기도)"
        default: ''

permissions:
  contents: write

concurrency:
  group: apt-meta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # 진행상황 DB를 복원한다. 이게 없으면 매일 처음부터 다시 받는다.
      - name: 진행상황 복원
        run: |
          if [ -f tools/apt_meta.db.gz ]; then
            gunzip -kf tools/apt_meta.db.gz
            echo "복원됨: $(du -h tools/apt_meta.db | cut -f1)"
          else
            echo "첫 실행 — 새 DB로 시작"
          fi

      - name: 인증키·필드명 확인
        if: inputs.stage == 'probe'
        env:
          APT_KEY: ${{ secrets.APT_KEY }}
        run: python tools/apt_meta.py --probe

      - name: 단지코드 목록
        if: inputs.stage == 'list' || inputs.stage == 'daily' || github.event_name == 'schedule' || github.event_name == 'push'
        env:
          APT_KEY: ${{ secrets.APT_KEY }}
        run: python tools/apt_meta.py --stage list

      - name: 단지별 기본·상세 정보
        if: inputs.stage == 'daily' || github.event_name == 'schedule' || github.event_name == 'push'
        env:
          APT_KEY: ${{ secrets.APT_KEY }}
        run: python tools/apt_meta.py --stage info --budget ${{ inputs.budget || 4800 }}

      # 좌표가 있어야 초품아(단지↔초등학교 거리)·직주근접·역세권 실측이 켜진다.
      # 카카오 로컬 무료 한도가 하루 10만건이라 22,000건은 한 번에 다 받는다.
      - name: 좌표 (지오코딩)
        if: inputs.stage == 'geocode' || inputs.stage == 'daily' || github.event_name == 'schedule' || github.event_name == 'push'
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          if [ -z "$KAKAO_REST_KEY" ]; then
            echo "KAKAO_REST_KEY 시크릿이 없어 건너뜁니다 (좌표 없이도 나머지는 돕니다)"
            exit 0
          fi
          python tools/apt_meta.py --geocode --budget 90000

      # 학교 목록·좌표는 거의 안 바뀌는데 7분 넘게 걸린다. 필요할 때만 돌린다.
      - name: 학교 (학교알리미)
        if: inputs.stage == 'schools'
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
        run: python tools/apt_meta.py --schools ${{ inputs.sido && format('--sido {0}', inputs.sido) || '' }}

      # 학급당 학생수(과밀). OpenAPI apiType=09 · 연 1회 갱신이라 가볍다.
      - name: 학급 과밀 (학급당 학생수)
        if: inputs.stage == 'crowd' || github.event_name == 'push'
        continue-on-error: true
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
        run: python tools/apt_meta.py --crowd ${{ inputs.sido && format('--sido {0}', inputs.sido) || '' }}

      # 진학 실적은 OpenAPI에 없어서 학교알리미 공시 화면이 쓰는 요청을 그대로 부른다.
      # 인증키가 필요 없는 대신 남의 웹 화면이라, 실패해도 나머지를 막지 않게 둔다.
      - name: 중학교 진학 실적 (학교알리미 공시)
        if: inputs.stage == 'progress' || github.event_name == 'push'
        continue-on-error: true
        run: python tools/apt_meta.py --progress ${{ inputs.sido && format('--sido {0}', inputs.sido) || '' }}

      - name: JSON 산출
        if: inputs.stage != 'probe'
        env:
          APT_KEY: ${{ secrets.APT_KEY }}
        run: python tools/apt_meta.py --emit

      - name: 커밋
        if: inputs.stage != 'probe'
        run: |
          gzip -9 -c tools/apt_meta.db > tools/apt_meta.db.gz
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/apt-meta data/schools tools/apt_meta.db.gz
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          DONE=$(python - <<'PY'
          import sqlite3
          c = sqlite3.connect('tools/apt_meta.db')
          t = c.execute('SELECT COUNT(*) FROM complex').fetchone()[0]
          d = c.execute('SELECT COUNT(*) FROM complex WHERE bass_done=1').fetchone()[0]
          print(f'{d:,}/{t:,}')
          PY
          )
          git commit -m "chore: 단지 메타 수집 ($DONE)"
          # 다른 워크플로가 그 사이 커밋했을 수 있다
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
