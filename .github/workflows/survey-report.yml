name: survey-report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run survey report
        run: node survey-report.mjs
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
