<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>부비 — 부동산 비서</title>
<!-- 바깥 사이트의 iframe 안에서 열리는 화면이다. 답변 속 링크를 프레임 안에서 열면
     남의 사이트 한구석에 부비 페이지가 갇힌 꼴이 되니 전부 새 창으로 보낸다. -->
<base target="_blank">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden}
  body{font-family:'Wanted Sans','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       color:#0D2A29;-webkit-font-smoothing:antialiased}
  /* 스크립트가 늦게 뜨는 동안의 빈 화면을 메운다 */
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #boot i{width:26px;height:26px;border-radius:50%;box-sizing:border-box;
    border:4px solid #E6EEFB;border-top-color:#3D8BFD;border-right-color:#26C6B9;
    animation:bsp .75s linear infinite}
  @keyframes bsp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><i></i></div>
<script>
  /* 이 페이지는 언제나 임베드 모드다 — 쿼리스트링이 빠져도 흔들리지 않게 못을 박는다 */
  window.BOOBI_EMBED=true;
  /* 패널이 올라오면 로딩 표시를 치운다 */
  new MutationObserver(function(_,ob){
    if(document.getElementById('hwbPanel')){
      var b=document.getElementById('boot'); if(b)b.remove();
      ob.disconnect();
    }
  }).observe(document.documentElement,{childList:true,subtree:true});
</script>
<script src="/hwon-bot.js?v=embed1" defer></script>
</body>
</html>
