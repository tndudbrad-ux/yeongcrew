<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="부비 프리미엄 미리보기 — 아파트 찾기 결과에서 잠긴 단지 목록이 열리는 예시 화면">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0.5"><stop offset="0" stop-color="#26C6B9"/><stop offset="0.6" stop-color="#3D8BFD"/><stop offset="1" stop-color="#8B6CF6"/></linearGradient>
<radialGradient id="r1" cx="0.88" cy="-0.08" r="0.62"><stop offset="0" stop-color="#3D8BFD" stop-opacity="0.16"/><stop offset="1" stop-color="#3D8BFD" stop-opacity="0"/></radialGradient>
<radialGradient id="r2" cx="-0.06" cy="1.04" r="0.6"><stop offset="0" stop-color="#2AC1BC" stop-opacity="0.2"/><stop offset="1" stop-color="#2AC1BC" stop-opacity="0"/></radialGradient>
<radialGradient id="r3" cx="1.06" cy="0.96" r="0.5"><stop offset="0" stop-color="#8B6CF6" stop-opacity="0.13"/><stop offset="1" stop-color="#8B6CF6" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FE9E4"/><stop offset="0.55" stop-color="#2AC1BC"/><stop offset="1" stop-color="#1B918D"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/></linearGradient>
<linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.92"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0D2A29" flood-opacity="0.10"/></filter>
<style>
text{font-family:'Pretendard','Wanted Sans','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
.h1{font-size:44px;font-weight:800;letter-spacing:-1.6px;fill:#0D2A29}
.sub{font-size:20px;fill:#547471;letter-spacing:-.3px}
.brand{font-size:20px;fill:#547471}
.brand b{font-weight:800;fill:#0D2A29}
.ctit{font-size:21px;font-weight:800;fill:#0D2A29;letter-spacing:-.4px}
.nm{font-size:19px;font-weight:700;fill:#0D2A29;letter-spacing:-.3px}
.meta{font-size:15px;fill:#8AA5A2}
.px{font-size:19px;font-weight:800;fill:#2A6FD8;text-anchor:end}
.tag{font-size:14px;font-weight:800;text-anchor:middle}
.pill{font-size:15px;font-weight:800;fill:#fff;text-anchor:middle}
.lock{font-size:19px;font-weight:800;fill:#0D2A29;text-anchor:middle;letter-spacing:-.4px}
.foot{font-size:16px;font-weight:700;fill:#2A6FD8;text-anchor:middle}
.samp{font-size:15px;font-weight:800;fill:#8AA5A2;text-anchor:middle}
</style>
</defs>

<rect width="1000" height="750" fill="#ffffff"/>
<rect width="1000" height="750" fill="url(#r1)"/>
<rect width="1000" height="750" fill="url(#r2)"/>
<rect width="1000" height="750" fill="url(#r3)"/>

<rect x="850" y="26" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.9" stroke="#E2ECEB" stroke-width="1.5"/>
<text class="samp" x="909" y="48">예시 화면</text>

<circle cx="67" cy="60" r="15" fill="none" stroke="url(#ring)" stroke-width="8"/>
<text class="brand" x="94" y="67"><tspan font-weight="800" fill="#0D2A29">부</tspan>동산 <tspan font-weight="800" fill="#0D2A29">비</tspan>서 · 프리미엄</text>

<text class="h1" x="52" y="140">잠긴 단지까지 <tspan fill="url(#g)">전부 열립니다</tspan></text>
<text class="sub" x="54" y="178">아파트 찾기 전체 목록과 부비의 모든 유료 기능을 한 번 결제로</text>

<rect x="52" y="208" width="896" height="496" rx="26" fill="url(#card)" stroke="#ffffff" stroke-width="2" filter="url(#sh)"/>

<text class="ctit" x="84" y="258">내 조건에 맞는 단지</text>
<rect x="822" y="238" width="96" height="30" rx="15" fill="url(#g)"/>
<text class="pill" x="870" y="258">전체 24곳</text>

<g>
<rect x="84" y="282" width="832" height="66" rx="14" fill="#fff" stroke="#E8F1F0"/>
<text class="nm" x="108" y="311">이문아이파크자이 3단지</text>
<text class="meta" x="108" y="333">동대문구 이문동 · 84㎡ · 2025년</text>
<text class="px" x="770" y="322">13.2억</text>
<rect x="796" y="303" width="96" height="28" rx="14" fill="#EAF3FE"/><text class="tag" x="844" y="322" fill="#2A6FD8">추천 1위</text>
</g>
<g>
<rect x="84" y="358" width="832" height="66" rx="14" fill="#fff" stroke="#E8F1F0"/>
<text class="nm" x="108" y="387">휘경자이디센시아</text>
<text class="meta" x="108" y="409">동대문구 휘경동 · 84㎡ · 2024년</text>
<text class="px" x="770" y="398">12.4억</text>
<rect x="812" y="379" width="80" height="28" rx="14" fill="#E6F7F5"/><text class="tag" x="852" y="398" fill="#178C88">역세권</text>
</g>
<g>
<rect x="84" y="434" width="832" height="66" rx="14" fill="#fff" stroke="#E8F1F0"/>
<text class="nm" x="108" y="463">래미안라그란데</text>
<text class="meta" x="108" y="485">동대문구 이문동 · 114㎡ · 2025년</text>
<text class="px" x="770" y="474">15.8억</text>
<rect x="796" y="455" width="96" height="28" rx="14" fill="#E6F7F5"/><text class="tag" x="844" y="474" fill="#178C88">대형평형</text>
</g>

<g opacity="0.45">
<rect x="84" y="510" width="832" height="66" rx="14" fill="#fff" stroke="#E8F1F0"/>
<rect x="108" y="528" width="230" height="16" rx="8" fill="#DCE9E8"/><rect x="108" y="552" width="170" height="12" rx="6" fill="#E8F1F0"/>
<rect x="700" y="534" width="70" height="16" rx="8" fill="#DCE9E8"/><rect x="800" y="531" width="92" height="24" rx="12" fill="#E8F1F0"/>
<rect x="84" y="586" width="832" height="66" rx="14" fill="#fff" stroke="#E8F1F0"/>
<rect x="108" y="604" width="190" height="16" rx="8" fill="#DCE9E8"/><rect x="108" y="628" width="150" height="12" rx="6" fill="#E8F1F0"/>
<rect x="700" y="610" width="70" height="16" rx="8" fill="#DCE9E8"/><rect x="800" y="607" width="92" height="24" rx="12" fill="#E8F1F0"/>
</g>
<rect x="78" y="506" width="844" height="150" rx="16" fill="url(#veil)"/>
<rect x="352" y="558" width="296" height="46" rx="23" fill="#fff" stroke="#3D8BFD" stroke-opacity="0.28" stroke-width="1.5"/>
<text class="lock" x="500" y="588">🔒 나머지 21곳은 프리미엄에서</text>

<rect x="84" y="668" width="146" height="34" rx="17" fill="#EAF3FE"/><text class="foot" x="157" y="690">990원 1회 결제</text>
<rect x="242" y="668" width="150" height="34" rx="17" fill="#EAF3FE"/><text class="foot" x="317" y="690">기간 제한 없음</text>
<rect x="404" y="668" width="164" height="34" rx="17" fill="#EAF3FE"/><text class="foot" x="486" y="690">계정에 바로 연결</text>
</svg>
