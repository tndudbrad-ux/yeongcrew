<script>
var PAY_API = 'https://boobi-pay.tndud-brad.workers.dev';

var q = new URLSearchParams(location.search);
var paymentKey = q.get('paymentKey');
var orderId    = q.get('orderId');
var amount     = q.get('amount');

var box = document.getElementById('box');
var mark = box.querySelector('.mark');
var ttl = document.getElementById('ttl');
var lead = document.getElementById('lead');
var detail = document.getElementById('detail');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }

function fail(title, msg){
  mark.className = 'mark';
  mark.style.background = 'linear-gradient(115deg,#F0968B,#E5484D)';
  mark.textContent = '!';
  ttl.textContent = title;
  lead.textContent = msg;
  detail.innerHTML =
    '<div class="btns">' +
      '<a class="btn pri" href="/pay.html">다시 시도하기</a>' +
      '<a class="btn sec" href="/contact.html">문의하기</a>' +
    '</div>' +
    '<p class="note">주문번호 ' + esc(orderId || '-') + ' — 결제가 실제로 이루어졌는데 이 화면이 보인다면, 이 주문번호와 함께 tndud.brad@gmail.com으로 알려주세요. 확인 후 즉시 처리해 드립니다.</p>';
}

if(!paymentKey || !orderId || !amount){
  fail('결제 정보가 없습니다', '결제 페이지에서 다시 시도해 주세요.');
}else{
  fetch(PAY_API + '/confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: Number(amount) })
  })
  .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    if(!res.ok){ fail('결제 승인에 실패했습니다', res.d.message || res.d.error || '잠시 후 다시 시도해 주세요.'); return; }
    var d = res.d;

    /* 가상계좌는 입금 전이라 아직 완료가 아닙니다 */
    if(d.status === 'WAITING_FOR_DEPOSIT'){
      mark.className = 'mark wait'; mark.textContent = '🏦';
      ttl.textContent = '입금을 기다리고 있어요';
      lead.textContent = '안내된 가상계좌로 입금이 확인되면 리포트를 이메일로 보내드립니다.';
    }else{
      mark.className = 'mark'; mark.textContent = '✓';
      ttl.textContent = '결제가 완료되었습니다';
      lead.textContent = '구매하신 리포트를 이메일로 보내드릴게요. 발송까지 최대 24시간이 걸릴 수 있습니다.';
      if(window.gtag){
        try{ gtag('event','purchase',{ transaction_id: orderId, currency:'KRW', value: Number(d.amount || amount),
          items:[{ item_id:'home-report', item_name: d.orderName || '집 종합 리포트 PDF', price: Number(d.amount || amount), quantity:1 }] }); }catch(x){}
      }
    }

    detail.innerHTML =
      '<table class="rc">' +
        '<tr><th>주문번호</th><td>' + esc(orderId) + '</td></tr>' +
        '<tr><th>상품</th><td>' + esc(d.orderName || '집 종합 리포트 PDF') + '</td></tr>' +
        '<tr><th>결제 금액</th><td><b>' + Number(d.amount || amount).toLocaleString('ko-KR') + '원</b></td></tr>' +
        (d.method ? '<tr><th>결제 수단</th><td>' + esc(d.method) + '</td></tr>' : '') +
        (d.approvedAt ? '<tr><th>승인 시각</th><td>' + esc(String(d.approvedAt).replace('T',' ').slice(0,19)) + '</td></tr>' : '') +
      '</table>' +
      '<div class="btns">' +
        (d.receiptUrl ? '<a class="btn sec" href="' + esc(d.receiptUrl) + '" target="_blank" rel="noopener">영수증 보기</a>' : '') +
        '<a class="btn pri" href="/account.html">마이페이지</a>' +
      '</div>' +
      '<p class="note">결제 내역과 영수증은 마이페이지에서 다시 확인할 수 있습니다. 문의: tndud.brad@gmail.com</p>';
  })
  .catch(function(e){
    fail('승인 요청 중 오류가 발생했습니다', '네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
  });
}
</script>
